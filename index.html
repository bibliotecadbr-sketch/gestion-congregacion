<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Integral de Congregación</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="loading-screen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center text-white">
        <div class="w-12 h-12 border-4 border-indigo-400 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-lg font-medium">Conectando con la nube...</p>
    </div>

    <div id="auth-view" class="hidden min-h-screen flex items-center justify-center p-4 bg-slate-900">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full text-center shadow-2xl">
            <h1 class="text-2xl font-bold text-indigo-700 mb-2">Gestión Congregación</h1>
            <p class="text-sm text-slate-600 mb-6">Inicia sesión para acceder al sistema</p>
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Contraseña</label>
                    <input type="password" id="login-password" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md transition">Entrar al Sistema</button>
            </form>
        </div>
    </div>

    <div id="app-view" class="hidden min-h-screen flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-3xl font-bold text-slate-800 mb-2">¡Conectado con éxito!</h1>
        <p class="text-slate-600 mb-4">La autenticación con Firebase se ha realizado correctamente.</p>
        <button onclick="auth.signOut()" class="px-4 py-2 bg-slate-800 text-white rounded-xl text-sm">Cerrar Sesión</button>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCczrVnAhSPtKn-iHYbs8pgTR_6rN9xz3E",
            authDomain: "integral-474fd.firebaseapp.com",
            projectId: "integral-474fd",
            storageBucket: "integral-474fd.firebasestorage.app",
            messagingSenderId: "600156147998",
            appId: "1:600156147998:web:c72dfc566c5e89881fb90f"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            try {
                await auth.signInWithEmailAndPassword(email, pass);
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        auth.onAuthStateChanged(user => {
            document.getElementById('loading-screen').classList.add('hidden');
            if (user) {
                document.getElementById('auth-view').classList.add('hidden');
                document.getElementById('app-view').classList.remove('hidden');
            } else {
                document.getElementById('auth-view').classList.remove('hidden');
                document.getElementById('app-view').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
